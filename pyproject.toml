[project]
name = "cost-budget-check"
version = "0.2.0"
description = "A skill that checks an AI feature's spend against its landing brief's cost budget."
requires-python = ">=3.9"
# Standard library only, on purpose: the scripts run inside sandboxes that cannot install packages.
dependencies = []

[tool.ruff]
line-length = 240
# Copied unchanged from the Leader Report at a pinned commit (see vendor/VENDORED.md); its own repo lints it.
extend-exclude = ["skills/cost-budget-check/scripts/vendor"]
target-version = "py39"

[tool.ruff.lint]
# E, F: errors and unused names. I: import order. B: likely bugs. UP: old syntax.
# SIM: needless complexity. S: security (bandit).
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
